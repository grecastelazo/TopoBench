name: ast_grid_search
method: grid

# We log this metric in `topobench/run.py` during the "best checkpoint re-test":
# `val_best_rerun/accuracy`
metric:
  name: val_best_rerun/accuracy
  goal: maximize

parameters:
  # Pass Hydra overrides via `${args}` (W&B injects `key=value` pairs).
  # Using `${batch_size}` inside the override string breaks because OmegaConf
  # treats `${...}` as interpolation.
  model.feature_encoder.out_channels:
    values: [8, 16, 32]
  model.backbone.n_layers:
    values: [1, 2, 3]
  optimizer.parameters.lr:
    values: [0.0001, 0.001, 0.01]
  dataset.split_params.data_seed:
    values: [0, 1, 2]
  trainer.devices:
    values: [[4]] # Run on different GPUs to speed up the sweep


command:
  - ${env}
  - bash
  - scripts/wandb_hydra_entrypoint.sh
  - model=hypergraph/allsettransformer
  - dataset=graph/a123
  - ${args}
